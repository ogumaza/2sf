# SPDX-License-Identifier: MIT

# A vX.Y.Z tag publishes a Windows x64 release. X.Y.Z must match CMakeLists.txt, with notes in
# docs/release-notes/X.Y.Z.md. The 2sfrip-X.Y.Z-win-x64.zip package contains 2sfrip.exe, README.md, LICENSE and
# THIRD-PARTY-NOTICES.md.
#
# A manual run (Actions > Release > Run workflow) builds the same zip and uploads it as a workflow artifact, without
# publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read the version and check for a matching tag and release notes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - id: version
        uses: ./externals/xsflib/ci/release-version
        with:
          project: twosf

  windows:
    needs: version
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./externals/xsflib/ci/release-windows
        with:
          version: ${{ needs.version.outputs.version }}
          cmake: -A x64 -T ClangCL -DTWOSF_TESTS=OFF
          targets: 2sfrip
          programs: 2sfrip
          files: build/Release/2sfrip.exe
          artifact: win-x64

  package:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./externals/xsflib/ci/package-converter
        with:
          program: 2sfrip
          version: ${{ needs.version.outputs.version }}

      - uses: ./externals/xsflib/ci/release-publish
        with:
          title: 2sf
          version: ${{ needs.version.outputs.version }}
          artifact: 2sf-${{ needs.version.outputs.version }}
